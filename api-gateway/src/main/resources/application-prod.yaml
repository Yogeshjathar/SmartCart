server:
  port: ${GATEWAY_PORT:8080}  # could override for prod if needed

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false   # Explicit routing recommended in prod
      routes:

        # ================= AUTH SERVICE =================
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        # ================= USER SERVICE =================
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**

        # ================= PRODUCT SERVICE =================
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**

        # ================= ORDER SERVICE =================
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**

        # ================= INVENTORY SERVICE =================
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**

        # ================= PAYMENT SERVICE =================
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**

        # ================= NOTIFICATION SERVICE =================
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:8081/.well-known/jwks.json

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:${EUREKA_PORT:8761}/eureka/
    fetch-registry: true
    register-with-eureka: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:api-gateway}
    instance-id: ${spring.application.name}:${eureka.instance.ip-address}:${server.port}:${spring.profiles.active}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus             # expose all actuator endpoints for monitoring
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized  # only admins see full health info
  metrics:
    export:
      prometheus:
        enabled: true                # allow Prometheus scraping
    enable:
      all: true                      # enable all default metrics
  tracing:
    sampling:
      probability: 0.1                # trace 10% of requests to reduce overhead
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans