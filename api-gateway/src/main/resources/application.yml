server:
    port: 8080

spring:
    application:
        name: api-gateway

    cloud:
        gateway:
            discovery:
                locator:
                    enabled: false   # Explicit routing (production best practice)

            routes:

                # ================= AUTH SERVICE =================
                - id: auth-service
                  uri: lb://auth-service
                  predicates:
                      - Path=/api/v1/auth/**
                  filters:
                      - RewritePath=/api/v1/auth/(?<segment>.*), /api/v1/${segment}

                # ================= USER SERVICE =================
                - id: user-service
                  uri: lb://user-service
                  predicates:
                      - Path=/api/v1/users/**
                  filters:
                      - RewritePath=/api/v1/users/(?<segment>.*), /api/v1/${segment}

                # ================= PRODUCT SERVICE =================
                - id: product-service
                  uri: lb://product-service
                  predicates:
                      - Path=/api/v1/products/**
                  filters:
                      - RewritePath=/api/v1/products/(?<segment>.*), /api/v1/${segment}

                # ================= ORDER SERVICE =================
                - id: order-service
                  uri: lb://order-service
                  predicates:
                      - Path=/api/v1/orders/**
                  filters:
                      - RewritePath=/api/v1/orders/(?<segment>.*), /api/v1/${segment}

                # ================= INVENTORY SERVICE =================
                - id: inventory-service
                  uri: lb://inventory-service
                  predicates:
                      - Path=/api/v1/inventory/**
                  filters:
                      - RewritePath=/api/v1/inventory/(?<segment>.*), /api/v1/${segment}

                # ================= PAYMENT SERVICE =================
                - id: payment-service
                  uri: lb://payment-service
                  predicates:
                      - Path=/api/v1/payments/**
                  filters:
                      - RewritePath=/api/v1/payments/(?<segment>.*), /api/v1/${segment}

                # ================= NOTIFICATION SERVICE =================
                - id: notification-service
                  uri: lb://notification-service
                  predicates:
                      - Path=/api/v1/notifications/**
                  filters:
                      - RewritePath=/api/v1/notifications/(?<segment>.*), /api/v1/${segment}

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
        fetch-registry: true
        register-with-eureka: true
        lease-renewal-interval-in-seconds: 30
        lease-expiration-duration-in-seconds: 90
    instance:
        prefer-ip-address: true
        hostname: ${HOSTNAME:localhost}  # optional for local dev
        instance-id: ${spring.application.name}:${eureka.instance.ip-address}:${server.port}:${spring.profiles.active}

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus