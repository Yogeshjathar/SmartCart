server:
  port: ${SERVER_PORT:8083} # default to 8083 for product-service, can override in prod

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/product_db  # local dev

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:8081/.well-known/jwks.json

  kafka:
    bootstrap-servers: localhost:9092           # dev Kafka

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:${EUREKA_PORT:8761}/eureka/
    fetch-registry: true
    register-with-eureka: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:user-service}
    instance-id: ${spring.application.name}:${eureka.instance.ip-address}:${server.port}:${spring.profiles.active}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus             # expose all actuator endpoints for monitoring

  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized  # only admins see full health info

  metrics:
    export:
      prometheus:
        enabled: true                # allow Prometheus scraping
    enable:
      all: true                      # enable all default metrics

  tracing:
    sampling:
      probability: 0.1                # trace 10% of requests to reduce overhead

  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

logging:
  level:
    root: WARN
    org.springframework: WARN
    com.smartcart.product: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

swagger:
  server-url: http://api.smartcart.com