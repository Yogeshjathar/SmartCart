server:
  port: ${USER_SERVICE_PORT:8082}

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://postgres:5432/user_db   # Docker container for prod
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate    # prod: validate schema only
    show-sql: false         # prod: disable SQL logging

  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

        acks: all
        retries: 10
        properties:
          enable.idempotence: true
          max.in.flight.requests.per.connection: 5
          delivery.timeout.ms: 120000
          request.timeout.ms: 30000
          linger.ms: 5
          batch.size: 16384
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:${EUREKA_PORT}/eureka/
    fetch-registry: true
    register-with-eureka: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
  instance:
    prefer-ip-address: true
    hostname: ${HOSTNAME:user-service}
    instance-id: ${spring.application.name}:${eureka.instance.ip-address}:${server.port}:${spring.profiles.active}

management:
  endpoints:
    web:
      exposure:
        include: "*"                 # expose all actuator endpoints for monitoring
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized  # only admins see full health info
  metrics:
    export:
      prometheus:
        enabled: true                # allow Prometheus scraping
    enable:
      all: true                      # enable all default metrics
  tracing:
    sampling:
      probability: 0.1                # trace 10% of requests to reduce overhead

logging:
  level:
    root: WARN
    org.springframework: WARN
    com.smartcart.user: INFO