spring:
  application:
    name: order-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

eureka:
  instance:
    metadata-map:
      version: 1.0
      environment: ${spring.profiles.active}

management:
  endpoints:
    web:
      base-path: /actuator

swagger:
  title: Order Service API
  description: APIs for managing orders in SmartCart
  version: v1.0