spring:
  application:
    name: auth-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

eureka:
  instance:
    metadata-map:
      version: 1.0
      environment: ${spring.profiles.active}

management:
  endpoints:
    web:
      base-path: /actuator

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  rsa:
    issuer: auth-service
    key-id: my-key-1
    access-token-expiration: 3600000  # 1 hour
    private-key-file: classpath:keys/private.pem
    public-key-file: classpath:keys/public.pem

swagger:
  title: Auth Service API
  description: APIs for authentication and authorization in SmartCart
  version: v1.0