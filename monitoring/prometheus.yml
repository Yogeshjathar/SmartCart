global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'smartcart-services'
    static_configs:
      - targets:
          - 'auth-service:8081'
          - 'user-service:8082'
          - 'product-service:8083'
          - 'inventory-service:8084'
          - 'order-service:8085'
          - 'payment-service:8086'
          - 'notification-service:8087'
